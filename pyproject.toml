[project]
name = "llm-extraction-release-gate"
version = "0.1.0"
description = "Evidence-first regression gates for structured LLM extraction"
readme = "README.md"
license = "MIT"
authors = [{name = "Ivan Matiushkin"}]
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic>=2.12,<3", "httpx>=0.28,<1", "jinja2>=3.1.6,<4"]

[project.scripts]
extraction-gate = "extraction_gate.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/extraction_gate"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "playwright>=1.50,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
