name: Verify extraction gate
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.23'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q --junitxml=test-results/unit.xml
      - name: Generate controls and replay published real captures
        run: |
          uv run python scripts/control_demo.py
          uv run python scripts/replay_evidence.py
      - run: uv run playwright install --with-deps chromium
      - run: uv run python scripts/browser_check.py
      - name: Build distributable package
        run: uv build
      - name: Check CLI from built wheel in isolated environment
        shell: bash
        run: |
          uv venv test-results/wheel-env
          if [ "$RUNNER_OS" = Windows ]; then
            PY=test-results/wheel-env/Scripts/python.exe
          else
            PY=test-results/wheel-env/bin/python
          fi
          uv pip install --python "$PY" dist/*.whl
          ROOT="$PWD"
          cd test-results
          "$ROOT/$PY" -m extraction_gate.cli compare "$ROOT/evidence/local-qwen/baseline" "$ROOT/evidence/local-qwen/candidate" --out wheel-report && exit 90 || code=$?
          test "$code" -eq 1
          test -f wheel-report/index.html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: verification-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            test-results/unit.xml
            test-results/browser/
            runs/control/blocked-report/
            runs/live-report/
            dist/
          retention-days: 14
